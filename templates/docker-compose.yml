# Local development / test only. Never referenced by the production deploy — prod points at a
# managed Postgres/Redis/RabbitMQ instance via env vars instead. `docker compose up -d` gives a
# working local stack immediately after clone, before the first `prisma migrate dev`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  <!-- SCAFFOLD: keep only if background jobs or caching was chosen -->
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  <!-- SCAFFOLD: keep only if messaging was chosen -->
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672' # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  <!-- SCAFFOLD: keep only if background jobs or caching was chosen -->
  redis-data:
  <!-- SCAFFOLD: keep only if messaging was chosen -->
  rabbitmq-data:
