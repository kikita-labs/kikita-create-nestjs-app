name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cyrillic/non-English content
        run: |
          if grep -rInP '[\p{Cyrillic}]' --include=*.md --include=*.json . ; then
            echo "::error::Cyrillic characters found in tracked files (English only)."
            exit 1
          fi
          echo "OK: no Cyrillic content."

      - name: Validate plugin.json
        run: python3 .github/scripts/check_plugin_json.py

      - name: Check for broken relative markdown links
        run: python3 .github/scripts/check_links.py
